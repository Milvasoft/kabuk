ShortDescription: A desktop shell for Windows with a bar, tiling windows and a launcher.
Description: >-
  Kabuk puts a bar on every monitor, tiles and floats your windows, opens apps from a
  launcher and shows notifications, in seven looks. Windows' taskbar is hidden while it
  runs and Windows is as it was when it exits. Installs for the current user without
  administrator rights; "kabuk --restore" or Ctrl+Alt+Shift+End brings Windows back at any
  time.
